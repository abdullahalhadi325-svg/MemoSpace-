workflows:
  android-build:
    name: Android Debug APK
    max_build_duration: 30
    instance_type: linux_x2
    environment:
      android_sdk: 34
      java: 17
    scripts:
      - name: Setup Gradle wrapper and Build APK
        script: |
          if [ ! -f "gradlew" ]; then
            gradle wrapper
          fi
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
    artifacts:
      - app/build/outputs/**/*.apk
